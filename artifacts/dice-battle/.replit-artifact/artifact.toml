kind = "mobile"
previewPath = "/"
title = "Dice Battle"
description = "An offline two-player dice game for Android with animated turns, configurable rounds and orientation, player photos, sound, detailed scoring, and winner results."
version = "1.0.0"
id = "artifacts/dice-battle"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 20658

[services.development]
run = "pnpm --filter @workspace/dice-battle run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dice-battle", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/dice-battle", "run", "serve" ]

[services.env]
PORT = "20658"
BASE_PATH = "/"
